# Skyramp Workspace Configuration
workspace:
  repoName: SinaeKim135/infisical
  repoUrl: https://github.com/SinaeKim135/infisical
metadata:
  schemaVersion: v1
  executorVersion: v1.3.40
  createdAt: "2026-08-26T19:28:03.888Z"
  updatedAt: "2026-08-26T19:28:03.893Z"
services:
  - serviceName: infisical-backend
    language: typescript
    framework: playwright
    testDirectory: tests/skyramp/backend
    api:
      authType: bearer
      authHeader: Authorization
      authScheme: Bearer
      baseUrl: http://localhost:8080/api
    runtimeDetails:
      serverStartCommand: docker compose -f docker-compose.bdd.yml up -d --build backend
      serverStopCommand: docker compose -f docker-compose.bdd.yml down -v
      runtime: docker
      dockerNetwork: infisical_default
  - serviceName: infisical-frontend
    language: typescript
    framework: playwright
    testDirectory: tests/skyramp/frontend
    api:
      authType: none
      authHeader: ""
      baseUrl: http://localhost:8080
    runtimeDetails:
      serverStartCommand: docker compose -f docker-compose.bdd.yml up -d --build frontend
      serverStopCommand: docker compose -f docker-compose.bdd.yml down -v
      runtime: docker
      dockerNetwork: infisical_default
