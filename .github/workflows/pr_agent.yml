name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr_agent_job:
    if: >-
      github.event.sender.type != 'Bot' &&
      (github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request))
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
      checks: write
    name: Run PR agent on every pull request, respond to user comments
    steps:
      - name: PR Agent action step
        id: pragent
        uses: docker://pragent/pr-agent:0.42.0-github_action
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Model — Anthropic key already exists as a repo secret
          ANTHROPIC.KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          config.model: "anthropic/claude-opus-4-8"
          config.fallback_models: '["anthropic/claude-sonnet-4-6"]'

          # describe runs before review and improve; enable_ai_metadata feeds its
          # per-file summaries into their prompts. generate_ai_title stays off by
          # default, so PR titles used for evaluation are preserved.
          github_action_config.auto_describe: "true"
          github_action_config.auto_review: "true"
          github_action_config.auto_improve: "true"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'
          config.enable_ai_metadata: "true"

          # Infisical carries CLAUDE.md, not the default AGENTS.md. The root file only links to the
          # nested ones, and repo_context_files does not follow links, so list all three (408 lines,
          # under the 500-line repo_context_max_lines cap).
          config.repo_context_files: '["CLAUDE.md", "backend/CLAUDE.md", "frontend/CLAUDE.md"]'

          # With allow_dynamic_context on, the hunk is anchored at the enclosing function signature if
          # one is found within max_extra_lines_before_dynamic_context; patch_extra_lines_before is only
          # the fallback when no signature is found in that window.
          config.max_extra_lines_before_dynamic_context: "24"
          config.patch_extra_lines_before: "10"
          config.patch_extra_lines_after: "4"

          pr_reviewer.require_tests_review: "true"
          # the default of 3 is interpolated straight into the prompt as "a concise list (0-3 issues)",
          # so it caps how many bugs a review can report at all
          pr_reviewer.num_max_findings: "8"
          pr_reviewer.extra_instructions: "Prioritise correctness defects that survive type checking and pattern-based SAST: null/undefined dereference, unawaited or misused promises, off-by-one and boundary errors, incorrect error handling, race conditions, wrong operator precedence, inverted conditions, and state left inconsistent on the failure path. Report a concrete failing input or execution path for each finding. Do not report style, naming, or formatting."

          pr_code_suggestions.num_code_suggestions_per_chunk: "8"
          pr_code_suggestions.suggestions_score_threshold: "7"

          config.verbosity_level: "2"
