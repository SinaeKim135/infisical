name: Skyramp Testbot

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.actor != 'skyramp-testbot[bot]' }}

jobs:
  testbot:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@skyramp-testbot') && github.event.comment.user.login != 'skyramp-testbot[bot]')
    runs-on: 'ubuntu-latest'
    permissions:
      contents: write
      pull-requests: write
      checks: write

    steps:
      - name: Generate GitHub App Token
        id: skyramp-testbot-app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.SKYRAMP_TESTBOT_APP_ID }}
          private-key: ${{ secrets.SKYRAMP_TESTBOT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          token: ${{ steps.skyramp-testbot-app-token.outputs.token }}

      - name: Create .env for SUT
        run: |
          cp .env.dev.example .env
          sed -i "s#ENCRYPTION_KEY=.*#ENCRYPTION_KEY=6c1fe4e407b8911c104518103505b218#" .env
          sed -i "s#SMTP_HOST=.*#SMTP_HOST=#" .env
          sed -i "s#SMTP_PORT=.*#SMTP_PORT=#" .env
          sed -i "s#SMTP_FROM_ADDRESS=.*#SMTP_FROM_ADDRESS=#" .env
          sed -i "s#SMTP_FROM_NAME=.*#SMTP_FROM_NAME=#" .env

      - name: Harden apt mirrors for Playwright browser deps
        run: |
          # skyramp/testbot runs `playwright install --with-deps chromium`, which
          # shells out to apt. The runner image already lists the Ubuntu archives
          # as failover behind azure.archive.ubuntu.com, but apt only falls through
          # after a fetch actually FAILS -- with the default timeouts a degraded
          # Azure mirror stalls instead. Short timeouts make that failover engage.
          {
            printf 'http://azure.archive.ubuntu.com/ubuntu/\tpriority:1\n'
            printf 'https://archive.ubuntu.com/ubuntu/\tpriority:2\n'
            printf 'https://security.ubuntu.com/ubuntu/\tpriority:3\n'
            printf 'http://us.archive.ubuntu.com/ubuntu/\tpriority:4\n'
          } | sudo tee /etc/apt/apt-mirrors.txt

          sudo tee /etc/apt/apt.conf.d/99-skyramp-apt >/dev/null <<'EOF'
          Acquire::Retries "5";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          DPkg::Lock::Timeout "300";
          EOF

          # Warm the package index so the action's own apt call hits a good cache.
          # Non-fatal: the action retries, and a stale index is better than a hard fail.
          for i in 1 2 3 4 5; do
            if sudo apt-get update -qq; then break; fi
            if [ "$i" -eq 5 ]; then
              echo "::warning::apt-get update failed after 5 attempts; continuing"
              break
            fi
            echo "apt-get update failed (attempt $i/5); retrying in $((i * 20))s"
            sleep $((i * 20))
          done

      - uses: skyramp/testbot@3d8f06f7223f2a7c187e4f3f3ed2b2e074770e8e # v0.11.10
        with:
          skyrampLicenseFile: ${{ secrets.SKYRAMP_LICENSE_FILE }}
          anthropicApiKey: ${{ secrets.SKYRAMP_TESTBOT_API_KEY }}
          githubToken: ${{ steps.skyramp-testbot-app-token.outputs.token }}
          # The token minted above is a GitHub App installation token, which dies
          # after 1 hour. Runs on this repo take longer than that, so the push and
          # API calls at delivery time were failing on an already-expired token.
          # Handing the action the App credentials lets it mint a fresh token right
          # before it needs one (skyramp/testbot >= v0.11.0).
          githubAppId: ${{ secrets.SKYRAMP_TESTBOT_APP_ID }}
          githubAppPrivateKey: ${{ secrets.SKYRAMP_TESTBOT_APP_PRIVATE_KEY }}
          targetSetupCommand: 'docker compose -f docker-compose.bdd.yml up -d --build'
          targetReadyCheckCommand: 'curl -sf http://localhost:8080/api/status && curl -sf http://localhost:8080 | grep -q "root"'
          # v0.10.6+ runs targetSetupCommand in the background, so the ready check
          # must outlast the full docker build (~12 min), not just server startup.
          targetReadyCheckTimeout: '1200'
          authTokenCommand: 'curl -sf -X POST http://localhost:8080/api/v1/admin/bootstrap -H "Content-Type: application/json" -d "{\"email\":\"admin@test.com\",\"password\":\"Password123!\",\"organization\":\"TestOrg\"}" | jq -r ".identity.credentials.token"'
          uiCredentials: 'username=admin@test.com;password=Password123!;role=admin'
          targetTeardownCommand: 'docker compose -f docker-compose.bdd.yml down -v'
