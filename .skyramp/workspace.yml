# Skyramp Workspace Configuration
workspace:
  repoName: SinaeKim135/infisical
  repoUrl: https://github.com/SinaeKim135/infisical
metadata:
  schemaVersion: v1
  mcpVersion: 0.2.7
  executorVersion: v1.3.28
  createdAt: "2026-06-24T03:44:04.085Z"
  updatedAt: "2026-06-24T03:44:04.093Z"
services:
  - serviceName: infisical-backend
    language: typescript
    framework: playwright
    testDirectory: tests/skyramp/backend
    api:
      schemaPath: http://localhost:4000/api/docs/json
      authType: bearer
      authHeader: Authorization
      baseUrl: http://localhost:4000
    runtimeDetails:
      serverStartCommand: docker compose -f docker-compose.dev.yml up -d backend
      runtime: docker
      dockerNetwork: infisical_default
  - serviceName: infisical-frontend
    language: typescript
    framework: playwright
    testDirectory: tests/skyramp/frontend
    api:
      authType: none
      authHeader: ""
      baseUrl: http://localhost:8080
    runtimeDetails:
      serverStartCommand: docker compose -f docker-compose.dev.yml up -d frontend
      runtime: docker
      dockerNetwork: infisical_default
